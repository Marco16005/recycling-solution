# Producción: imagen runner con HTTPS. Datos en el volumen db_datos (respaldar con el perfil respaldo).
# Dos modos (docs/operacion.md, §9):
#   - con Caddy propio: COMPOSE_PROFILES=caddy (usa los puertos 80 y 443 del servidor);
#   - detrás de un proxy que ya existe (p. ej. el del punto de venta): sin perfil; ese proxy envía el tráfico a
#     127.0.0.1:${PUERTO_WEB_LOCAL} (solo accesible desde el propio servidor).
# Los límites de memoria evitan que el piloto le quite recursos al otro sistema del servidor.
# Plan de seguridad (2026-11-10, docs/superpowers/specs/2026-11-10-endurecer-contenedores-design.md): ningún proceso gana
# privilegios al ejecutar otro programa, y todos empiezan sin capacidades del sistema. Las pocas que un servicio necesita
# se devuelven en él, una por una y con su motivo.
x-endurecido: &endurecido
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  db:
    restart: unless-stopped
    mem_limit: ${LIMITE_MEMORIA_DB:-512m}

  web:
    <<: *endurecido
    build: { context: ., target: runner }
    environment:
      DATABASE_URL: postgres://rs_app:${RS_APP_PASSWORD:?Falta RS_APP_PASSWORD en .env}@db:5432/recycling
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Falta BETTER_AUTH_SECRET en .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Falta BETTER_AUTH_URL en .env}
      MAPA_ESTILO_URL: ${MAPA_ESTILO_URL:-https://tiles.openfreemap.org/styles/liberty}
      # Plan 7: con el perfil mapa activo, http://osrm:5000; vacío = tiempos aproximados (fórmula).
      OSRM_URL: ${OSRM_URL:-}
    ports:
      - "127.0.0.1:${PUERTO_WEB_LOCAL:-3001}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      bootstrap: { condition: service_completed_successfully }
    # Plan de seguridad (S8): Docker sabe si la aplicación responde; Caddy espera a que esté sana.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/entrar').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    mem_limit: ${LIMITE_MEMORIA_WEB:-512m}

  osrm:
    restart: unless-stopped
    mem_limit: ${LIMITE_MEMORIA_OSRM:-256m}

  # Plan de seguridad (S4): Caddy corre sin privilegios. Este paso, como root y sin red, deja /data y /config a su nombre
  # antes de cada arranque; así sirven también los volúmenes que creó una versión anterior que corría como root.
  proxy-permisos:
    <<: *endurecido
    # Cambia el dueño de los volúmenes de Caddy, cuyas carpetas son 0700.
    cap_add: [CHOWN, DAC_READ_SEARCH]
    build: { context: ./infra/caddy }
    image: rs-caddy:2.11.9
    profiles: ["caddy"]
    user: root
    network_mode: none
    entrypoint: ["chown", "-R", "caddy:caddy", "/data", "/config"]
    volumes:
      - caddy_datos:/data
      - caddy_config:/config
    restart: "no"

  proxy:
    <<: *endurecido
    # Plan de seguridad (S4): imagen propia, compilada con dependencias corregidas y sin curl (infra/caddy/Dockerfile).
    build: { context: ./infra/caddy }
    image: rs-caddy:2.11.9
    profiles: ["caddy"]
    mem_limit: 128m
    ports:
      - "${PUERTO_HTTP:-80}:80"
      - "${PUERTO_HTTPS:-443}:443"
    environment:
      DOMINIO: ${DOMINIO:-localhost}
      DOMINIO_ALTERNO: ${DOMINIO_ALTERNO:-}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
      proxy-permisos: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  caddy_datos: {}
  caddy_config: {}
