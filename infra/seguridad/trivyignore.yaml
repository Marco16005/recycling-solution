# Plan de seguridad (§4): excepciones de Trivy (configuración), con motivo.
misconfigurations:
  - id: DS-0002
    paths: ["infra/mapa/Dockerfile"]
    statement: >-
      La imagen del mapa prepara el volumen como root (preparar-mapa, sin puertos y solo al actualizar). El servicio osrm
      corre como nobody (user 65534 en compose.yaml) y monta el mapa en solo lectura.
