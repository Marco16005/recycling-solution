# Pruebas: base desechable en memoria y servicios de verificación.
services:
  db:
    environment:
      # Contraseñas fijas de una base desechable en memoria; no protegen nada.
      POSTGRES_PASSWORD: rs_super_prueba
      RS_MIGRADOR_PASSWORD: migrador_prueba
      RS_APP_PASSWORD: app_prueba
    # Sin volumen de datos (memoria), pero con el script que crea los roles.
    volumes: !override
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data

  unit:
    build: { context: ., target: dev }
    command: ["npm", "run", "verificar"]
    volumes:
      - .:/app
      - modulos:/app/node_modules
      - next_cache:/app/.next

  integration:
    build: { context: ., target: dev }
    command: ["npm", "run", "prueba:integracion"]
    environment:
      OSRM_URL: http://osrm:5000
      PRUEBA_ADMIN_URL: postgres://rs_super:rs_super_prueba@db:5432/postgres
      RS_MIGRADOR_PASSWORD: migrador_prueba
      RS_APP_PASSWORD: app_prueba
    volumes:
      - .:/app
      - modulos:/app/node_modules
    depends_on:
      db: { condition: service_healthy }
      osrm: { condition: service_healthy }

  # Plan 7: OSRM con un mapa sintético propio (infra/mapa/prueba), siempre activo en las pruebas.
  mapa-prueba-osm:
    build: { context: ., target: dev }
    command: ["node", "/generador/generar-cuadricula.mjs", "/mapa/prueba.osm"]
    volumes:
      - ./infra/mapa/prueba:/generador:ro
      - mapa_prueba:/mapa

  mapa-prueba:
    build: { context: ./infra/mapa }
    image: rs-mapa:v26.9.0
    entrypoint: ["preparar-mapa", "prueba"]
    volumes:
      - mapa_prueba:/mapa
    depends_on:
      mapa-prueba-osm: { condition: service_completed_successfully }

  osrm:
    profiles: !reset []
    volumes: !override
      - mapa_prueba:/mapa:ro
    depends_on:
      mapa-prueba: { condition: service_completed_successfully }

  migrate:
    environment:
      MIGRADOR_DATABASE_URL: postgres://rs_migrador:migrador_prueba@db:5432/recycling

  bootstrap:
    environment:
      DATABASE_URL: postgres://rs_app:app_prueba@db:5432/recycling

  # Usuarios sintéticos para punta a punta. Se niega a correr fuera de este archivo.
  semilla:
    build: { context: ., target: dev }
    command: ["npx", "tsx", "scripts/semilla-e2e.mts"]
    environment:
      DATABASE_URL: postgres://rs_app:app_prueba@db:5432/recycling
      E2E_CLAVE: clave-e2e-sintetica
      E2E_SEMILLA_PERMITIDA: "1"
    depends_on:
      migrate: { condition: service_completed_successfully }

  # La imagen de producción, como la correría la empresa.
  web:
    build: { context: ., target: runner }
    environment:
      DATABASE_URL: postgres://rs_app:app_prueba@db:5432/recycling
      BETTER_AUTH_SECRET: secreto-de-pruebas-e2e-de-al-menos-32-caracteres
      BETTER_AUTH_URL: http://web:3000
      MAPA_ESTILO_URL: https://tiles.openfreemap.org/styles/liberty
      OSRM_URL: http://osrm:5000
      # Las pruebas entran muchas veces desde una sola IP; el límite se prueba en auth.integracion.test.ts.
      AUTH_LIMITAR_INTENTOS: "no"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/entrar').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      semilla: { condition: service_completed_successfully }
      osrm: { condition: service_healthy }

  e2e:
    build: { context: ., target: e2e }
    ipc: host
    environment:
      PLAYWRIGHT_BASE_URL: http://web:3000
      DATABASE_URL: postgres://rs_app:app_prueba@db:5432/recycling
      # Solo para e2e/ultimo-publicar-aviso.spec.ts, que publica el aviso como lo haría el script.
      MIGRADOR_DATABASE_URL: postgres://rs_migrador:migrador_prueba@db:5432/recycling
      E2E_CLAVE: clave-e2e-sintetica
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
    depends_on:
      web: { condition: service_healthy }

volumes:
  modulos: {}
  next_cache: {}
  mapa_prueba: {}
