# Servicios comunes. Se combina con compose.dev.yaml, compose.test.yaml o compose.prod.yaml
# (ver COMPOSE_FILE en .env.example y el Plan 1 v2, §6).
services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: rs_super
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}  # obligatorio fuera de pruebas (ver .env.example)
      POSTGRES_DB: recycling
      RS_MIGRADOR_PASSWORD: ${RS_MIGRADOR_PASSWORD:-}
      RS_APP_PASSWORD: ${RS_APP_PASSWORD:-}
    volumes:
      - db_datos:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP: durante la inicialización Postgres solo escucha en el socket local, así que
      # el servicio no se reporta sano hasta que existen los roles.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rs_super -d recycling"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Aplica migraciones como rs_migrador, vuelve a aplicar permisos y verifica huellas. Termina y sale.
  migrate:
    build: { context: ., target: dev }
    command: ["npm", "run", "migrar"]
    # Los datos AVISO_* y PUBLICADO_POR los usa scripts/publicar-aviso.mts, que corre en este servicio.
    env_file:
      - path: .env
        required: false
    environment:
      MIGRADOR_DATABASE_URL: postgres://rs_migrador:${RS_MIGRADOR_PASSWORD:-}@db:5432/recycling
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  # Crea el primer administrador si no existe (ADMIN_* en .env). Idempotente. También sirve para los
  # scripts de usuarios: docker compose run --rm bootstrap npm run alta-usuario -- --correo … --nombre … --rol …
  bootstrap:
    build: { context: ., target: dev }
    command: ["npm", "run", "bootstrap"]
    environment:
      DATABASE_URL: postgres://rs_app:${RS_APP_PASSWORD:-}@db:5432/recycling
      ADMIN_CORREO: ${ADMIN_CORREO:-}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-}
      ADMIN_CLAVE: ${ADMIN_CLAVE:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  # Respaldo con pg_dump a ./respaldos (docs/operacion.md explica cómo restaurar).
  respaldo:
    image: postgres:17.11-alpine
    profiles: ["respaldo"]
    environment:
      PGPASSWORD: ${RS_MIGRADOR_PASSWORD:-}
    volumes:
      - ./respaldos:/respaldos
    entrypoint:
      - sh
      - -c
      - >-
        pg_dump -h db -U rs_migrador -d recycling -Fc -f /respaldos/recycling-$$(date +%Y%m%d-%H%M%S).dump
        && echo "Respaldo creado:" && ls -1t /respaldos | head -1
    depends_on:
      db: { condition: service_healthy }

volumes:
  db_datos: {}
