# Servicios comunes. Se combina con compose.dev.yaml, compose.test.yaml o compose.prod.yaml
# (ver COMPOSE_FILE en .env.example y el Plan 1 v2, §6).
# Plan de seguridad (2026-11-10, docs/superpowers/specs/2026-11-10-endurecer-contenedores-design.md): ningún proceso gana
# privilegios al ejecutar otro programa, y todos empiezan sin capacidades del sistema. Las pocas que un servicio necesita
# se devuelven en él, una por una y con su motivo.
x-endurecido: &endurecido
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  db:
    <<: *endurecido
    # El arranque oficial corre como root: recorre y ajusta la carpeta de datos (de postgres, 0700) y baja a postgres con
    # su-exec. Ya en marcha, Postgres no tiene ninguna capacidad.
    cap_add: [CHOWN, DAC_READ_SEARCH, FOWNER, SETUID, SETGID]
    # Postgres oficial con zlib 1.4 (infra/db/Dockerfile, plan de seguridad del 2026-11-07).
    build: { context: ./infra/db }
    image: rs-postgres:17.11
    environment:
      POSTGRES_USER: rs_super
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}  # obligatorio fuera de pruebas (ver .env.example)
      POSTGRES_DB: recycling
      RS_MIGRADOR_PASSWORD: ${RS_MIGRADOR_PASSWORD:-}
      RS_APP_PASSWORD: ${RS_APP_PASSWORD:-}
    volumes:
      - db_datos:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP: durante la inicialización Postgres solo escucha en el socket local, así que
      # el servicio no se reporta sano hasta que existen los roles.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rs_super -d recycling"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Aplica migraciones como rs_migrador, vuelve a aplicar permisos y verifica huellas. Termina y sale.
  migrate:
    <<: *endurecido
    build: { context: ., target: dev }
    command: ["npm", "run", "migrar"]
    # Los datos AVISO_* y PUBLICADO_POR los usa scripts/publicar-aviso.mts, que corre en este servicio.
    env_file:
      - path: .env
        required: false
    environment:
      MIGRADOR_DATABASE_URL: postgres://rs_migrador:${RS_MIGRADOR_PASSWORD:-}@db:5432/recycling
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  # Crea el primer administrador si no existe (ADMIN_* en .env). Idempotente. También sirve para los
  # scripts de usuarios: docker compose run --rm bootstrap npm run alta-usuario -- --correo … --nombre … --rol …
  bootstrap:
    <<: *endurecido
    build: { context: ., target: dev }
    command: ["npm", "run", "bootstrap"]
    environment:
      DATABASE_URL: postgres://rs_app:${RS_APP_PASSWORD:-}@db:5432/recycling
      ADMIN_CORREO: ${ADMIN_CORREO:-}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-}
      ADMIN_CLAVE: ${ADMIN_CLAVE:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  # Respaldo con pg_dump a ./respaldos (docs/operacion.md explica cómo restaurar).
  respaldo:
    <<: *endurecido
    # Corre como root y escribe en ./respaldos, que en el servidor es de otro usuario.
    cap_add: [DAC_OVERRIDE]
    # Postgres oficial con zlib 1.4 (infra/db/Dockerfile, plan de seguridad del 2026-11-07).
    build: { context: ./infra/db }
    image: rs-postgres:17.11
    profiles: ["respaldo"]
    environment:
      PGPASSWORD: ${RS_MIGRADOR_PASSWORD:-}
    volumes:
      - ./respaldos:/respaldos
    entrypoint:
      - sh
      - -c
      - >-
        pg_dump -h db -U rs_migrador -d recycling -Fc -f /respaldos/recycling-$$(date +%Y%m%d-%H%M%S).dump
        && echo "Respaldo creado:" && ls -1t /respaldos | head -1
    depends_on:
      db: { condition: service_healthy }

  # Plan 7: mapa de calles. Se prepara una vez con scripts/preparar-mapa.sh (perfil preparar-mapa) y osrm lo sirve solo a
  # la red interna (sin puertos publicados). Sin el perfil mapa, la aplicación planea con la fórmula aproximada.
  mapa-preparar:
    <<: *endurecido
    build: { context: ./infra/mapa }
    image: rs-mapa:v26.9.0
    profiles: ["preparar-mapa"]
    entrypoint: ["preparar-mapa"]
    environment:
      MAPA_FECHA: ${MAPA_FECHA:-}
      MAPA_CAJA: ${MAPA_CAJA:--100.65,20.45,-100.05,20.85}
    volumes:
      - mapa_datos:/mapa

  osrm:
    <<: *endurecido
    build: { context: ./infra/mapa }
    image: rs-mapa:v26.9.0
    profiles: ["mapa"]
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "400", "--port", "5000", "/mapa/mapa.osrm"]
    # Plan de seguridad (S7): sirve sin privilegios (nobody); solo lee el mapa. Prepararlo (preparar-mapa) sí escribe el
    # volumen y corre como root, sin puertos y solo al actualizar el mapa.
    user: "65534:65534"
    volumes:
      - mapa_datos:/mapa:ro
    healthcheck:
      # Cualquier respuesta JSON de OSRM (también NoSegment) indica que el servicio está arriba.
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:5000/nearest/v1/driving/-100.3,20.62 | grep -q '\"code\"'"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  db_datos: {}
  mapa_datos: {}
